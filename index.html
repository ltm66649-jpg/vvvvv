<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أدوات الروابط</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .header {
      background: #1a1a2e;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .hamburger {
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .hamburger span {
      width: 25px;
      height: 3px;
      background: white;
      display: block;
      transition: 0.3s;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    .menu {
      position: absolute;
      top: 70px;
      right: 20px;
      background: #1a1a2e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
    }

    .menu.show {
      display: flex;
    }

    .menu button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .menu button:hover {
      background: #764ba2;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
      padding: 20px;
    }

    .content {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 50px;
      max-width: 600px;
      width: 100%;
      display: none;
    }

    .content.active {
      display: block;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #555;
      font-weight: 600;
    }

    input[type="url"],
    input[type="text"],
    select {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
    }

    .result {
      margin-top: 40px;
      padding: 25px;
      background: #f8f9fa;
      border-radius: 10px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 10px;
    }

    .result-link {
      background: white;
      padding: 15px;
      border-radius: 8px;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #667eea;
      margin-bottom: 15px;
      border: 1px solid #e0e0e0;
    }

    .copy-btn {
      background: #4CAF50 !important;
    }

    .copy-btn:hover {
      background: #45a049 !important;
    }

    .error {
      color: #f44336;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      margin: 15px 0;
      font-weight: bold;
    }

    .keyword-inputs {
      display: none;
    }

    .keyword-inputs.show {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🔗 أدوات الروابط</div>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="menu" id="menu">
    <button onclick="switchTab('shorten'); toggleMenu()">🔗 اختصار الرابط</button>
    <button onclick="switchTab('formatter'); toggleMenu()">📝 تغيير الصيغة</button>
  </div>

  <div class="container">
    <!-- اختصار الرابط -->
    <div id="shorten" class="content active">
      <h1>🔗 اختصار الروابط</h1>
      
      <form id="shortenForm">
        <div class="form-group">
          <label for="urlInput">أدخل الرابط:</label>
          <input type="url" id="urlInput" placeholder="https://example.com" required>
        </div>

        <div class="loading" id="loading">جاري المعالجة...</div>
        <button class="submit-btn" type="submit">اختصر الرابط</button>
        <div class="error" id="error"></div>
      </form>

      <div class="result" id="result">
        <div class="result-label">الرابط المختصر:</div>
        <div class="result-link" id="shortenedUrl"></div>
        <button class="submit-btn copy-btn" onclick="copyToClipboard('shortenedUrl')">نسخ الرابط ✓</button>
      </div>
    </div>

    <!-- تغيير الصيغة -->
    <div id="formatter" class="content">
      <h1>📝 تغيير صيغة الرابط</h1>
      
      <form id="formatterForm">
        <div class="form-group">
          <label for="domainSelect">اختر النطاق:</label>
          <select id="domainSelect" onchange="updateKeywords()">
            <option value="">اختر النطاق</option>
            <option value="tiktok">TikTok</option>
            <option value="youtube">YouTube</option>
            <option value="instagram">Instagram</option>
            <option value="twitter">Twitter</option>
            <option value="facebook">Facebook</option>
          </select>
        </div>

        <div class="keyword-inputs" id="keywordInputs"></div>

        <button class="submit-btn" type="submit">بناء الرابط</button>
        <div class="error" id="formatterError"></div>
      </form>

      <div class="result" id="formatterResult">
        <div class="result-label">الرابط الجديد:</div>
        <div class="result-link" id="formattedUrl"></div>
        <button class="submit-btn copy-btn" onclick="copyToClipboard('formattedUrl')">نسخ الرابط ✓</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://vvvvv-production-7945.up.railway.app';

    const keywordConfigs = {
      tiktok: [
        { key: 'username', label: 'اسم المستخدم', placeholder: '@username' },
        { key: 'videoId', label: 'معرّف الفيديو', placeholder: '7123456789' }
      ],
      youtube: [
        { key: 'channel', label: 'اسم القناة', placeholder: '@channelname' },
        { key: 'videoId', label: 'معرّف الفيديو', placeholder: 'dQw4w9WgXcQ' }
      ],
      instagram: [
        { key: 'username', label: 'اسم المستخدم', placeholder: 'username' },
        { key: 'postId', label: 'معرّف المنشور', placeholder: 'ABC123' }
      ],
      twitter: [
        { key: 'username', label: 'اسم المستخدم', placeholder: '@username' },
        { key: 'tweetId', label: 'معرّف التغريدة', placeholder: '1234567890' }
      ],
      facebook: [
        { key: 'username', label: 'اسم الصفحة', placeholder: 'pageusername' },
        { key: 'postId', label: 'معرّف المنشور', placeholder: '123456789' }
      ]
    };

    function toggleMenu() {
      document.getElementById('hamburger').classList.toggle('active');
      document.getElementById('menu').classList.toggle('show');
    }

    function switchTab(tab) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
    }

    function updateKeywords() {
      const domain = document.getElementById('domainSelect').value;
      const keywordInputs = document.getElementById('keywordInputs');
      
      if (!domain) {
        keywordInputs.classList.remove('show');
        keywordInputs.innerHTML = '';
        return;
      }

      const config = keywordConfigs[domain];
      let html = '';

      config.forEach(keyword => {
        html += `
          <div class="form-group">
            <label for="${keyword.key}">${keyword.label}:</label>
            <input type="text" id="${keyword.key}" placeholder="${keyword.placeholder}" required>
          </div>
        `;
      });

      keywordInputs.innerHTML = html;
      keywordInputs.classList.add('show');
    }

    function copyToClipboard(elementId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text);
      alert('تم النسخ ✓');
    }

    document.getElementById('shortenForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const url = document.getElementById('urlInput').value;
      const errorDiv = document.getElementById('error');
      const loading = document.getElementById('loading');
      const resultDiv = document.getElementById('result');
      
      errorDiv.classList.remove('show');
      loading.style.display = 'block';

      try {
        const response = await fetch(`${API_URL}/api/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (data.shortened) {
          document.getElementById('shortenedUrl').textContent = data.shortened;
          resultDiv.classList.add('show');
          document.getElementById('urlInput').value = '';
        }
      } catch (error) {
        errorDiv.textContent = 'فشل الاتصال بالخادم';
        errorDiv.classList.add('show');
      } finally {
        loading.style.display = 'none';
      }
    });

    document.getElementById('formatterForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const domain = document.getElementById('domainSelect').value;
      const errorDiv = document.getElementById('formatterError');
      const resultDiv = document.getElementById('formatterResult');
      
      if (!domain) {
        errorDiv.textContent = 'اختر نطاق';
        errorDiv.classList.add('show');
        return;
      }

      errorDiv.classList.remove('show');

      try {
        const config = keywordConfigs[domain];
        let url = `${domain}.com/`;

        config.forEach(keyword => {
          const value = document.getElementById(keyword.key).value;
          if (!value) throw new Error(`أدخل ${keyword.label}`);
          
          if (keyword.key === 'username') {
            url += value.replace('@', '');
          } else if (keyword.key === 'channel') {
            url += value.replace('@', 'c/');
          } else {
            url += `/${value}`;
          }
        });

        document.getElementById('formattedUrl').textContent = url;
        resultDiv.classList.add('show');
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.add('show');
      }
    });
  </script>
</body>
</html>
