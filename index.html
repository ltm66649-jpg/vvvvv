<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختصار الروابط</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 50px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .gps-status {
      text-align: center;
      font-size: 13px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .gps-status.waiting {
      background: #fff3cd;
      color: #856404;
    }

    .gps-status.active {
      background: #d4edda;
      color: #155724;
    }

    .gps-status.error {
      background: #f8d7da;
      color: #721c24;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #555;
      font-weight: 600;
    }

    input[type="url"] {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
    }

    input[type="url"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .result {
      margin-top: 40px;
      padding: 25px;
      background: #f8f9fa;
      border-radius: 10px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 10px;
    }

    .result-link {
      background: white;
      padding: 15px;
      border-radius: 8px;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #667eea;
      margin-bottom: 15px;
      border: 1px solid #e0e0e0;
    }

    .copy-btn {
      background: #4CAF50;
      padding: 12px;
      width: 100%;
    }

    .copy-btn:hover {
      background: #45a049;
    }

    .error {
      color: #f44336;
      text-align: center;
      margin-top: 15px;
      display: none;
      padding: 12px;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 اختصار الروابط</h1>
    <div class="gps-status waiting" id="gpsStatus">
      ⏳ جاري تفعيل GPS...
    </div>
    
    <form id="shortenForm">
      <div class="form-group">
        <label for="urlInput">أدخل الرابط:</label>
        <input 
          type="url" 
          id="urlInput" 
          placeholder="https://example.com" 
          required
        >
      </div>

      <div class="loading" id="loading">جاري المعالجة...</div>
      <button type="submit">اختصر الرابط</button>
      <div class="error" id="error"></div>
    </form>

    <div class="result" id="result">
      <div class="result-label">الرابط المختصر:</div>
      <div class="result-link" id="shortenedUrl"></div>
      <button class="copy-btn" onclick="copyToClipboard()">نسخ الرابط ✓</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://vvvvv-production-7945.up.railway.app';
    
    const gpsOptions = {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    };

    function updateGPSStatus(status, type = 'waiting') {
      const statusDiv = document.getElementById('gpsStatus');
      statusDiv.textContent = status;
      statusDiv.className = `gps-status ${type}`;
    }

    if (navigator.geolocation) {
      updateGPSStatus('⏳ جاري الحصول على الموقع...', 'waiting');
      
      navigator.geolocation.watchPosition(
        (position) => {
          const accuracy = position.coords.accuracy.toFixed(0);
          updateGPSStatus(`✓ GPS Active (±${accuracy}م)`, 'active');
        },
        (error) => {
          updateGPSStatus('❌ GPS معطل', 'error');
        },
        gpsOptions
      );
    } else {
      updateGPSStatus('❌ المتصفح ما يدعم GPS', 'error');
    }

    document.getElementById('shortenForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const url = document.getElementById('urlInput').value;
      const errorDiv = document.getElementById('error');
      const loading = document.getElementById('loading');
      const resultDiv = document.getElementById('result');
      
      errorDiv.classList.remove('show');
      loading.style.display = 'block';

      try {
        const response = await fetch(`${API_URL}/api/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })  // ← بدون GPS!
        });

        const data = await response.json();

        if (data.shortened) {
          document.getElementById('shortenedUrl').textContent = data.shortened;
          resultDiv.classList.add('show');
          document.getElementById('urlInput').value = '';
        }
      } catch (error) {
        errorDiv.textContent = 'فشل الاتصال بالخادم';
        errorDiv.classList.add('show');
      } finally {
        loading.style.display = 'none';
      }
    });

    function copyToClipboard() {
      const text = document.getElementById('shortenedUrl').textContent;
      navigator.clipboard.writeText(text);
      alert('تم النسخ ✓');
    }
  </script>
</body>
</html>
