<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أدوات الروابط</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .navbar {
      background: #1a1a2e;
      padding: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .nav-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .nav-btn.active {
      background: #764ba2;
      transform: scale(1.05);
    }

    .nav-btn:hover {
      transform: translateY(-2px);
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      padding: 20px;
    }

    .content {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 50px;
      max-width: 600px;
      width: 100%;
      display: none;
    }

    .content.active {
      display: block;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #555;
      font-weight: 600;
    }

    input[type="url"],
    input[type="text"],
    select {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .result {
      margin-top: 40px;
      padding: 25px;
      background: #f8f9fa;
      border-radius: 10px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 10px;
    }

    .result-link {
      background: white;
      padding: 15px;
      border-radius: 8px;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #667eea;
      margin-bottom: 15px;
      border: 1px solid #e0e0e0;
    }

    .copy-btn {
      background: #4CAF50;
      padding: 12px;
      width: 100%;
    }

    .copy-btn:hover {
      background: #45a049;
    }

    .error {
      color: #f44336;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      font-weight: bold;
    }

    .success {
      color: #4CAF50;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .success.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <button class="nav-btn active" onclick="switchTab('shorten')">اختصار الرابط</button>
    <button class="nav-btn" onclick="switchTab('formatter')">تغيير صيغة الرابط</button>
  </div>

  <div class="container">
    <!-- اختصار الرابط -->
    <div id="shorten" class="content active">
      <h1>🔗 اختصار الروابط</h1>
      
      <form id="shortenForm">
        <div class="form-group">
          <label for="urlInput">أدخل الرابط:</label>
          <input type="url" id="urlInput" placeholder="https://example.com" required>
        </div>

        <div class="loading" id="loading">جاري المعالجة...</div>
        <button type="submit">اختصر الرابط</button>
        <div class="error" id="error"></div>
      </form>

      <div class="result" id="result">
        <div class="result-label">الرابط المختصر:</div>
        <div class="result-link" id="shortenedUrl"></div>
        <button class="copy-btn" onclick="copyToClipboard('shortenedUrl')">نسخ الرابط ✓</button>
      </div>
    </div>

    <!-- تغيير الصيغة -->
    <div id="formatter" class="content">
      <h1>📝 تغيير صيغة الرابط</h1>
      
      <form id="formatterForm">
        <div class="form-group">
          <label for="formatterInput">أدخل الرابط:</label>
          <input type="text" id="formatterInput" placeholder="https://example.com/path?param=value" required>
        </div>

        <div class="form-group">
          <label for="formatSelect">اختر الصيغة:</label>
          <select id="formatSelect">
            <option value="tiktok">TikTok</option>
            <option value="youtube">YouTube</option>
            <option value="instagram">Instagram</option>
            <option value="twitter">Twitter</option>
            <option value="facebook">Facebook</option>
            <option value="short">Short Format</option>
          </select>
        </div>

        <button type="submit">غيّر الصيغة</button>
        <div class="error" id="formatterError"></div>
      </form>

      <div class="result" id="formatterResult">
        <div class="result-label">الرابط المُعدّل:</div>
        <div class="result-link" id="formattedUrl"></div>
        <button class="copy-btn" onclick="copyToClipboard('formattedUrl')">نسخ الرابط ✓</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://vvvvv-production-7945.up.railway.app';

    function switchTab(tab) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    function copyToClipboard(elementId) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text);
      alert('تم النسخ ✓');
    }

    // تغيير الصيغة
    function formatURL(url, format) {
      try {
        const urlObj = new URL(url);
        const hostname = urlObj.hostname;
        const pathname = urlObj.pathname;

        switch (format) {
          case 'tiktok':
            return `tiktok.com${pathname}${urlObj.search}`;
          case 'youtube':
            return `youtube.com${pathname}${urlObj.search}`;
          case 'instagram':
            return `instagram.com${pathname}${urlObj.search}`;
          case 'twitter':
            return `twitter.com${pathname}${urlObj.search}`;
          case 'facebook':
            return `facebook.com${pathname}${urlObj.search}`;
          case 'short':
            const id = pathname.split('/').filter(p => p).slice(-1)[0] || 'link';
            return `short.url/${id}`;
          default:
            return url;
        }
      } catch
